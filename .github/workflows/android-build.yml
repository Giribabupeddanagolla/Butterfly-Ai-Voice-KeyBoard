name: Build Android Butterfly AI Keyboard APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper executable
        run: |
          chmod +x android/gradlew
          chmod +x android/gradlew.bat

      - name: Build Signed Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace
        working-directory: ./android

      - name: Prepare and Verify APK Artifacts
        run: |
          mkdir -p release-apks
          cp android/app/build/outputs/apk/release/app-release.apk release-apks/butterfly-ai-keyboard.apk
          cp android/app/build/outputs/apk/release/app-release.apk release-apks/butterfly-ai-keyboard-v1.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apks/butterfly-ai-keyboard-debug.apk
          
          # Verification: Check DEX, binary AndroidManifest.xml, and APK integrity
          python3 -c "
          import zipfile, os
          apk_path = 'release-apks/butterfly-ai-keyboard.apk'
          size = os.path.getsize(apk_path)
          print(f'APK File Size: {size} bytes ({round(size / (1024*1024), 2)} MB)')
          assert size > 2 * 1024 * 1024, 'APK size is too small (< 2MB)!'
          z = zipfile.ZipFile(apk_path)
          nl = z.namelist()
          assert 'AndroidManifest.xml' in nl, 'Missing AndroidManifest.xml'
          assert 'classes.dex' in nl, 'Missing classes.dex'
          assert 'resources.arsc' in nl, 'Missing resources.arsc'
          manifest = z.read('AndroidManifest.xml')
          assert manifest[:4] == b'\x03\x00\x08\x00', 'AndroidManifest.xml is not compiled binary AXML!'
          dex = z.read('classes.dex')
          assert dex[:4] == b'dex\n', 'Invalid DEX header in classes.dex!'
          print('APK Validation SUCCESS: File is a complete, genuine, installable Android APK.')
          "

      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: butterfly-ai-keyboard-apks
          path: release-apks/
          if-no-files-found: error

      - name: Publish GitHub Release with Direct APK Download
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Butterfly AI Keyboard v1.0.0 (Build ${{ github.run_number }})
          body: |
            ### Butterfly AI Voice Keyboard Android APK Release
            - **Package**: `com.butterflyai.keyboard`
            - **Version**: `1.0.0` (Code `1`)
            - **Compatibility**: Android 8.0 (API 26) through Android 14 (API 34)
            - **Architecture**: Universal (supports all 32-bit & 64-bit ARM/x86 devices)
            
            #### Direct Download:
            Download **`butterfly-ai-keyboard.apk`** below and tap to install on any Android phone.
          files: |
            release-apks/butterfly-ai-keyboard.apk
            release-apks/butterfly-ai-keyboard-v1.0.apk
            release-apks/butterfly-ai-keyboard-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
