name: Backend CI & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Lint & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pytest httpx

      - name: Lint with Flake8 (Syntax errors & undefined symbols)
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 backend --exclude=backend/.venv,backend/venv --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint with Flake8 (Complexity & warnings)
        run: |
          # exit-zero treats all errors as warnings
          flake8 backend --exclude=backend/.venv,backend/venv --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run Backend Pytest Test Suites
        run: |
          cd backend
          pytest tests/ -v --tb=short

  docker-build:
    name: Docker Build & Verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: butterfly-ai-backend:latest
